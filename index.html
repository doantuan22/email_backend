<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bộ câu hỏi khảo sát chuyên môn và nhu cầu nâng cấp hệ thống ASTER">
  <title>Khảo sát chuyên môn hệ thống ASTER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-wrapper">
    <section class="form-card" aria-labelledby="form-title">
      <header class="form-header">
        <p class="form-eyebrow">KHẢO SÁT DÀNH CHO BÁC SĨ VÀ ĐỘI NGŨ CHUYÊN MÔN</p>
        <h1 id="form-title">BỘ CÂU HỎI KHẢO SÁT CHUYÊN MÔN VÀ NHU CẦU NÂNG CẤP HỆ THỐNG ASTER</h1>
        <section class="purpose-section" aria-labelledby="purpose-title">
          <h2 id="purpose-title">Mục đích khảo sát</h2>
          <div id="survey-purpose" class="purpose-content"></div>
        </section>
      </header>

      <form id="customer-form" novalidate>
        <div class="form-group respondent-group">
          <label for="name">Họ và tên <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" placeholder="Nhập họ và tên của bạn" autocomplete="name" required>
          <p class="field-hint">Thông tin này được dùng để phân biệt câu trả lời của từng người.</p>
        </div>

        <nav class="survey-navigation" aria-label="Điều hướng khảo sát">
          <a href="#part1" data-section-link="part1">Phần 1</a>
          <a href="#part2" data-section-link="part2">Phần 2</a>
          <a href="#part3" data-section-link="part3">Phần 3</a>
        </nav>

        <div id="survey-progress" class="survey-progress" aria-live="polite">
          <span id="progress-label">Phần 1 / 3</span>
          <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
        </div>

        <div id="survey-sections" class="survey-sections"></div>

        <div class="form-actions">
          <div class="draft-actions">
            <button type="button" id="clear-draft-button" class="secondary-button">XÓA NỘI DUNG ĐÃ NHẬP</button>
          </div>
          <button type="submit" class="submit-button">GỬI THÔNG TIN</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <script src="questions.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
